<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Médico - Fila de Triagem</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/config.js"></script>
    <style>
        /* Estilos do Alerta de Emergência */
        .emergency-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .emergency-overlay.hidden { display: none; }

        .emergency-modal {
            background: #111;
            border: 3px solid #ff3b30;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 59, 48, 0.6);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 20px rgba(255, 59, 48, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 80px rgba(255, 59, 48, 0.9); transform: scale(1.02); }
            100% { box-shadow: 0 0 20px rgba(255, 59, 48, 0.4); transform: scale(1); }
        }

        .emergency-icon {
            font-size: 80px;
            color: #ff3b30;
            margin-bottom: 20px;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0); }
        }

        .emergency-title {
            color: #ff3b30;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .emergency-patient {
            font-size: 24px;
            color: white;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .close-emergency {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #555;
            font-size: 28px;
            cursor: pointer;
        }

        .btn-attend-now {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-attend-now:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        /* Indicador Live */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            margin-left: 20px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="dashboard-body">
    <!-- Background animado com "blobs" -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2" style="background: radial-gradient(circle, #ef4444, transparent);"></div>
    
    <div class="dashboard-container glass-panel">
        <header>
            <div class="logo">
                <i class="fa-solid fa-users-viewfinder"></i>
                <h1>MediFlow <span>Painel Médico</span></h1>
            </div>
            <div class="header-actions">
                <a href="index.html" class="nav-link"><i class="fa-solid fa-stethoscope"></i> Nova Triagem</a>
                <button id="clearQueueBtn" class="btn-secondary"><i class="fa-solid fa-trash-can"></i> Limpar Fila</button>
            </div>
        </header>

        <div class="queue-stats">
            <div class="stat-box">
                <h4>Total na Fila</h4>
                <span id="statTotal">0</span>
            </div>
            <div class="stat-box critical-stat">
                <h4>Críticos</h4>
                <span id="statCritical">0</span>
            </div>
        </div>

        <div class="queue-list" id="queueList">
            <!-- Renderizado via JS -->
            <div class="empty-state">
                <i class="fa-solid fa-bed-pulse"></i>
                <p>Nenhum paciente na fila.</p>
            </div>
        </div>
    </div>

    <!-- Overlay de Emergência -->
    <div id="emergencyOverlay" class="emergency-overlay hidden">
        <div class="emergency-modal">
            <button class="close-emergency" id="closeEmergency"><i class="fa-solid fa-xmark"></i></button>
            <div class="emergency-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="emergency-title">PACIENTE CRÍTICO DETECTADO</div>
            <div class="emergency-patient" id="emergencyPatientName">NOME DO PACIENTE</div>
            <button class="btn-attend-now" id="btnAttendNow">INICIAR ATENDIMENTO IMEDIATO</button>
        </div>
    </div>

    <script src="assets/js/dashboard.js?v=patient-identification-1"></script>
</body>
</html>
